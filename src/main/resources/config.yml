# PluginGuard settings
#
# Hides which plugins your server runs from players. Staff with the bypass
# permission see everything as normal.
# After editing, run /pluginguard reload. No restart needed.
#
# Guide: https://github.com/ESMP-FUN/PluginGuard/tree/main/docs

# ----- Updates -----

# How PluginGuard handles new versions:
#   notify      tells staff when an update is out (nothing is downloaded)
#   check-only  checks quietly, no message
#   download    downloads the update when you run /pluginguard update download
#   auto-stage  downloads it by itself; it installs on the next restart
#   off         never checks
update:
  mode: notify
  # How often to check, in hours.
  check-interval-hours: 6

# ----- What players see -----

# What /plugins, /version, /help and /icanhasbukkit answer:
#   unknown-command    the same "Unknown or incomplete command" a made-up
#                      command gets (the most convincing)
#   empty              "Plugins (0):"
#   fake-list          the names in fake-plugins below
#   permission-denied  your server's normal "no permission" message
hide-mode: "unknown-command"

# The plugin names /plugins shows when hide-mode is "fake-list".
fake-plugins:
  - "ServerCore"
  - "WorldManager"
  - "CoreProtect"
  - "EveryoneChat"

# Players with this permission see the real server and are never tracked.
bypass-permission: "pluginguard.bypass"

# ----- Commands -----

# Commands that give the plugin list away. Typing any of these gets the
# hide-mode answer. This also covers /bukkit:plugins and /minecraft:help.
protected-commands:
  - "pl"
  - "plugins"
  - "ver"
  - "version"
  - "?"
  - "help"
  - "about"
  - "icanhasbukkit"

# Blocks every command typed as /bukkit:something or /minecraft:something.
block-bukkit-commands: true

# Blocks commands typed with a plugin name in front, like /essentials:home.
# The part before the colon is the plugin's name, so one of these would give
# the plugin away. They are also taken out of TAB suggestions.
block-namespaced-commands: true

# When on, /bukkit:plugins shows the hide-mode answer instead of "Unknown
# command". Only matters while block-bukkit-commands is on.
redirect-bukkit-commands: false

# Takes the commands above out of the list players get when they press TAB.
hide-tab-completion: true

# When a player runs a plugin command they aren't allowed to use, the plugin
# usually replies "You don't have permission", which proves it is installed.
# With this on, they get "Unknown command" instead.
# Only works for commands that list a permission in their plugin.
block-unknown-commands: true

# Commands of popular plugins that players try, to see if you run them.
# Typing one gets "Unknown command" (while block-common-plugin-commands is on).
# Remove any your players are meant to use.
common-plugin-commands:
  - "essentials"
  - "ess"
  - "worldedit"
  - "we"
  - "luckperms"
  - "lp"
  - "coreprotect"
  - "co"
  - "vault"
  - "multiverse"
  - "mv"
  - "citizens"
  - "npc"
  - "clearlag"
  - "dynmap"
  - "griefprevention"
  - "gp"
  - "holographicdisplays"
  - "hd"

block-common-plugin-commands: true

# ----- Server software -----

# Hides that you run Paper (or Spigot, Purpur...) in the server list, on the
# F3 screen in game, and in the query answer. They show fake-server-brand
# instead. The F3 screen and query need Paper.
hide-server-brand: true

# What to show instead, for example "vanilla".
fake-server-brand: "vanilla"

# When a player joins, the server tells their game which "channels" plugins
# use to talk to client mods, like "worldedit:cui". That list names your
# plugins, so this empties it. Needs Paper.
# This happens before the player has fully joined, so staff with the bypass
# permission get the empty list too.
hide-plugin-channels: true

# Channels to keep while hide-plugin-channels is on. Only needed if a client
# mod stops working. Builders with the WorldEdit CUI mod, for example, need
# "worldedit:cui". Everyone can see the channels listed here.
allowed-plugin-channels: []

# ----- Aggressive mode -----

# Hides every plugin command from players unless they have the permission
# "<command>.use", for example "home.use" for /home. This also hides commands
# you want players to use, so you must give those permissions yourself.
aggressive-mode: false

# ----- Catching players who look for your plugins -----

# PluginGuard counts it when a player tries the commands above and warns your
# staff when someone clearly goes looking. Players with the bypass permission
# are never counted.
logging:
  # Writes every attempt to plugins/PluginGuard/probes.log.
  log-to-file: false

  # When probes.log is bigger than this many megabytes, it is renamed to
  # probes.old.log and a new one is started. 0 lets it grow forever.
  log-max-size-mb: 5

  # Also writes every attempt to the console. Busy servers will find this noisy.
  log-individual-probes: false

  detection:
    # Turns the warnings off completely when false.
    enabled: true

    # Each attempt adds points:
    #   3  /bukkit:... or /minecraft:... commands, /icanhasbukkit, /essentials:home style
    #   2  /pl, /plugins, /ver, /version, /about
    #   1  one of the common-plugin-commands
    #   5  a honeypot command (see the bottom of this file)
    # /help and /? never count, normal players use them all the time.
    # Staff are warned once a player reaches score-threshold points within
    # window-seconds. With the defaults: 5 points within 60 seconds, so
    # /pl followed by /ver is enough.
    score-threshold: 5
    window-seconds: 60

    # Seconds before the same player can cause another warning. 300 = 5 minutes.
    alert-cooldown-seconds: 300

    # Online staff with this permission get the warning in chat. The console
    # always gets it.
    notify-permission: "pluginguard.alerts"

    # Console commands to run when a player sets off a warning, for example to
    # kick them. Leave empty to only warn staff.
    # %player% is their name, %uuid% their UUID, %score% their points.
    # Example:
    #   alert-commands:
    #     - "kick %player% Please don't probe the server."
    alert-commands: []

    # Also post each warning in a Discord channel. In Discord, open the
    # channel's settings, then Integrations, then Webhooks. Create one, copy
    # its URL and paste it between the quotes. Leave empty to turn off.
    discord-webhook: ""

# Honeypots: made-up commands only someone searching your server would try.
# Typing one gets "Unknown command" and sets off a warning straight away.
# Pick names that don't exist on your server.
honeypot-commands:
  - "staffchat"
  - "adminchat"
  - "modchat"
  - "opme"
